[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "agent-fleet"
version = "0.1.0"
description = "Local-first, verification-oriented agent workflow control plane"
readme = "README.md"
requires-python = ">=3.12,<3.15"
authors = [{ name = "Agent Fleet contributors" }]
dependencies = [
  "platformdirs>=4.2,<5",
  "openai>=3.8,<4",
  "pydantic>=2.12,<3",
  "pydantic-ai-slim[openai]>=2.39,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
fleet = "agent_fleet.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_fleet"]

[tool.hatch.build.targets.sdist]
include = [
  "/src/agent_fleet",
  "/README.md",
  "/pyproject.toml",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tooling"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
files = ["src", "tests"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
  "integration: tests multiple real adapters together",
  "e2e: subprocess-level end-to-end tests",
  "docker_integration: explicit opt-in tests against a real local Docker daemon",
  "live_provider: explicit opt-in test that contacts a configured model provider",
]

[tool.coverage.run]
branch = true
source = ["agent_fleet"]

[tool.coverage.report]
show_missing = true
skip_covered = true
