[build-system]
requires = ["hatchling==1.32.0"]
build-backend = "hatchling.build"

[project]
name = "agent-fleet"
version = "0.1.0"
description = "Agent Fleet Foundry: a local-first, verification-oriented agent control plane"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.12,<3.15"
authors = [{ name = "Agent Fleet contributors" }]
dependencies = [
  "anthropic==1.3.0",
  "google-genai==2.18.0",
  "jsonschema==4.26.0",
  "langgraph==1.2.11",
  "langchain-core==1.4.7",
  "langgraph-checkpoint==4.1.0",
  "langgraph-prebuilt==1.1.0",
  "langgraph-sdk==0.4.4",
  "langchain-protocol==0.0.15",
  "langsmith==0.12.2",
  "uuid-utils==0.12.0",
  "ormsgpack==1.12.0",
  "xxhash==4.0.1",
  "orjson==3.11.5",
  "jsonpatch==1.33",
  "jsonpointer==3.0.0",
  "requests-toolbelt==1.0.0",
  "zstandard==0.25.0",
  "platformdirs>=4.2,<5",
  "openai>=3.8,<4",
  "openai-agents==0.22.1",
  "pydantic>=2.12,<3",
  "pydantic-ai-slim[openai,anthropic,google]>=2.39,<3",
  "PyYAML>=6.0,<7",
  "rich>=13.7,<15",
  "typer>=0.12,<1",
]

[project.urls]
Homepage = "https://github.com/meyowu/agent-fleet-foundry"
Repository = "https://github.com/meyowu/agent-fleet-foundry"
Issues = "https://github.com/meyowu/agent-fleet-foundry/issues"

[project.optional-dependencies]
dev = [
  "hatchling==1.32.0",
  "pip==26.2.1",
  "mypy>=1.11,<2",
  "pytest>=8.3,<10",
  "pytest-asyncio>=0.24,<2",
  "pytest-cov>=5,<8",
  "ruff>=0.6,<1",
  "types-PyYAML>=6.0,<7",
]

[project.scripts]
fleet = "agent_fleet.cli.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/agent_fleet"]

[tool.hatch.build.targets.wheel.force-include]
"docs/USER_GUIDE.md" = "agent_fleet/assets/USER_GUIDE.md"

[tool.hatch.build.targets.sdist]
include = [
  "/src/agent_fleet",
  "/README.md",
  "/LICENSE",
  "/pyproject.toml",
  "/docs/USER_GUIDE.md",
]

[tool.ruff]
target-version = "py312"
line-length = 100
extend-exclude = [".tooling"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "C4", "SIM", "RUF", "ASYNC"]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101"]

[tool.mypy]
python_version = "3.12"
strict = true
pretty = true
show_error_codes = true
files = ["src", "tests"]
exclude = ["^src/agent_fleet/assets/"]
plugins = ["pydantic.mypy"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
asyncio_mode = "auto"
markers = [
  "integration: tests multiple real adapters together",
  "e2e: subprocess-level end-to-end tests",
  "docker_integration: explicit opt-in tests against a real local Docker daemon",
  "live_provider: explicit opt-in test that contacts a configured model provider",
  "installed_distribution: explicit opt-in fresh installation using a prepared wheelhouse",
]

[tool.coverage.run]
branch = true
source = ["agent_fleet"]

[tool.coverage.report]
show_missing = true
skip_covered = true
